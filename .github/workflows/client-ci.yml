name: Client auth compatibility
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-auth: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test with no production Firebase configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1234567890","project_id":"synthetic-ci","storage_bucket":"synthetic-ci.invalid"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0000000000000000000000","android_client_info":{"package_name":"com.swiftyspiffy.burkeblackapp"}},"api_key":[{"current_key":"synthetic-ci-not-a-real-api-key"}]}],"configuration_version":"1"}
          JSON
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PgoApiAuth=${{ matrix.go-auth }}
