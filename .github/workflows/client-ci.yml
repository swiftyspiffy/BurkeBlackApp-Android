name: Client auth compatibility
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-auth: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test with no production Firebase configuration
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PgoApiAuth=${{ matrix.go-auth }} -x processDebugGoogleServices
